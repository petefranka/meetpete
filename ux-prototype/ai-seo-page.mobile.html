  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

    window.addEventListener('message', function (e) {

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              totalLen += value.length;

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

age loads over HTTPS.', warn: 'Your site uses HTTPS, but some images still load insecurely.', bad: 'Your site loads over plain HTTP.' },\n    why: 'Browsers warn visitors away from insecure sites, and search engines trust them less.',\n    fix: 'Switch on the free SSL certificate in your hosting settings and redirect HTTP to HTTPS.',\n    test: 'Load http://{d}. It should redirect to https:// with a padlock and no mixed-content warnings.',\n    code: null, src: ['Google: page experience', 'https://developers.google.com/search/docs/appearance/page-experience'] },\n  { id: 'cwv', cat: 0, tech: 'Core Web Vitals', impact: 11,\n    h: { good: 'Pages load quickly', warn: 'Pages are a bit slow on mobile', bad: 'Pages are slow to load' },\n    mean: { good: 'Your main content loads in 1.9s on mobile.', warn: 'Your main content takes 3.4s on mobile. Google recommends under 2.5s.', bad: 'Your main content takes 5.8s on mobile, and the layout jumps as it loads.' },\n    why: 'Slow pages rank lower and lose visitors before they see what you do.',\n    fix: 'Compress images, serve them as WebP with set dimensions, and lazy-load anything below the fold.',\n    test: 'Run {d} through PageSpeed Insights. LCP should be under 2.5s and CLS under 0.1.',\n    code: LT + 'img src=\"hero.webp\" width=\"1200\" height=\"800\" loading=\"lazy\" alt=\"Bridal bouquet\">',\n    src: ['Google: Core Web Vitals', 'https://developers.google.com/search/docs/appearance/core-web-vitals'] },\n  { id: 'canonical', cat: 0, tech: 'Canonical tags', impact: 7,\n    h: { good: 'Each page has one clear address', warn: 'Some pages have duplicate addresses', bad: 'Duplicate pages are competing with each other' },\n    mean: { good: 'Every page declares a canonical URL.', warn: '3 pages load at both www and non-www with no canonical tag.', bad: 'Most pages have no canonical tag, and several exist under two or more URLs.' },\n    why: 'When the same page lives at several addresses, search engines split its ranking ll, src: HELP },\n  { id: 'eeat', cat: 1, tech: 'E-E-A-T signals', impact: 10,\n    h: { good: 'Your expertise shows', warn: 'Your expertise is hard to spot', bad: 'No sign of who is behind the business' },\n    mean: { good: 'You have an about page, real names, credentials and reviews on-site.', warn: 'You have an about page, but no names, qualifications or years of experience.', bad: \"There's no about page, no names and no evidence of experience.\" },\n    why: 'Google and AI tools favour businesses that show real experience and expertise. Anonymous sites get passed over.',\n    fix: \"Add an about page with who you are, how long you've been doing it, qualifications and photos of real work.\",\n    test: 'Ask someone new to find out who runs the business and why they are qualified. It should take under a minute.',\n    code: null, src: HELP },\n  { id: 'titles', cat: 1, tech: 'Titles & meta descriptions', impact: 8,\n    h: { good: 'Every page has a clear title', warn: 'Some titles are vague or repeated', bad: 'Titles are missing or all the same' },\n    mean: { good: 'Each page has a unique title and description.', warn: '4 pages share the title \"Home\" and 3 have no description.', bad: 'Every page uses the same title, and none have descriptions.' },\n    why: 'Titles are the headline in search results and the first thing AI reads about a page.',\n    fix: 'Give every page a unique title with your service and town, and a one-line description.',\n    test: 'Search site:{d} on Google. Every result should have a distinct, descriptive title.',\n    code: LT + 'title>Wedding Flowers in Leeds | Bloom Floristry' + LT + '/title>\\n' + LT + 'meta name=\"description\" content=\"Handmade wedding flowers in Leeds. Free consultations.\">',\n    src: ['Google: title links', 'https://developers.google.com/search/docs/appearance/title-link'] },\n  { id: 'headings', cat: 1, tech: 'Heading structure', impact: 6,\n    h: { good: 'Pages are well organised', warn: 'Headings are a bit messy', bad: \"Pages have no clear structure\" },\n    mean: { good: 'Each page has one clear main heading and sensible subheadings.', warn: 'Some pages have two main headings or skip levels.', bad: 'Most pages have no real headings, just large bold text.' },\n    why: 'Headings are how search engines and AI work out what each part of a page is about.',\n    fix: 'Give each page one H1, then H2s for each section.',\n    test: 'Use a heading-checker browser extension. Each page should show one H1 and logical H2s.',\n    code: LT + 'h1>Wedding flowers in Leeds' + LT + '/h1>\\n' + LT + 'h2>Bridal bouquets' + LT + '/h2>\\n' + LT + 'h2>Prices' + LT + '/h2>',\n    src: STARTER },\n  { id: 'schema', cat: 2, tech: 'LocalBusiness schema', impact: 15,\n    h: { good: 'Machines know exactly who you are', warn: 'Your business details are incomplete', bad: 'Search engines have to guess what you do' },\n    mean: { good: 'Your site declares your name, address, hours and services.', warn: 'Your structured data is missing opening hours and prices.', bad: \"There's no structured data, so your address, hours and services are guesswork.\" },\n    why: \"Structured data is a label machines read instantly. It's how assistants answer \\\"what time does it open?\\\"\",\n    fix: 'Add a LocalBusiness block to your homepage.',\n    test: \"Paste your homepage into Google's Rich Results Test. A LocalBusiness item should appear with no errors.\",\n    code: LT + 'script type=\"application/ld+json\">\\n{\\n  \"@context\": \"https://schema.org\",\\n  \"@type\": \"LocalBusiness\",\\n  \"name\": \"Your Business\",\\n  \"telephone\": \"+44 113 000 0000\",\\n  \"openingHours\": \"Mo-Fr 09:00-17:00\"\\n}\\n' + LT + '/script>',\n    src: ['Google: LocalBusiness structured data', 'https://developers.google.com/search/docs/appearance/structured-data/local-business'] },\n  { id: 'schemaValid', cat: 2, tech: 'Schema validation', impact: 6,\n    h: { good: 'Structured data has no errors', warn: 'Structured data has warnings', bad: 'Structured data has errors' },\n    mean: { good: 'Every schema block validates cleanly.', warn: 'Two schema blocks are missing recommended fields like image and priceRange.', bad: 'Your schema has syntax errors, so search engines ignore it.' },\n    why: \"Broken structured data is the same as none. Machines skip what they can't parse.\",\n    fix: 'Fix the reported errors and add the recommended fields.',\n    test: 'Run each page through the Schema Markup Validator. It should report 0 errors.',\n    code: null, src: ['Google: structured data guidelines', 'https://developers.google.com/search/docs/appearance/structured-data/sd-policies'] },\n  { id: 'js', cat: 3, tech: 'JavaScript rendering', impact: 12,\n    h: { good: 'AI can read your words', warn: 'Some text is buried in code', bad: 'AI sees the structure, not your content' },\n    mean: { good: \"22% of each page is readable text. That's healthy.\", warn: 'Only 9% of each page is readable text. The rest is code.', bad: 'Your text loads with JavaScript, so AI sees a near-empty page.' },\n    why: \"Most AI crawlers don't run JavaScript. If your words only appear after it runs, AI never sees them.\",\n    fix: 'Ask whoever built your site to switch on server-side rendering or pre-rendering.',\n    test: 'Turn off JavaScript in your browser and reload {d}. Your main text should still be there.',\n    code: null, src: ['Google: JavaScript SEO basics', 'https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics'] },\n  { id: 'answers', cat: 3, tech: 'Answer-ready content', impact: 8,\n    h: { good: 'You answer customer questions directly', warn: 'Some common questions go unanswered', bad: \"AI can't find answers to common questions\" },\n    mean: { good: 'Your FAQ and service pages state prices, areas and availability in plain sentences.', warn: \"You mention prices and areas, but not in a way AI can quote as an answer.\", bad: \"There's no FAQ, and key facts like prices and service areas aren't stated anywhere.\" },\n    why: 'AI assistants quote short, direct answers. If yours are missing, they quote someone else.',\n    fix: 'Add an FAQ page answering the top 8–10 customer questions in one or two sentences each.',\n    test: 'Ask ChatGPT a common question about your business. Check its answer matches what your site says.',\n    code: null, src: ['Google: AI features and your website', 'https://developers.google.com/search/docs/appearance/ai-features'] },\n  { id: 'llms', cat: 3, tech: 'llms.txt', impact: 4,\n    h: { good: 'You have an llms.txt file', warn: 'Your llms.txt is incomplete', bad: 'No llms.txt file' },\n    mean: { good: 'An llms.txt file summarises your business and key pages for AI tools.', warn: 'Your llms.txt exists but only lists your homepage.', bad: \"There's no llms.txt file on your site.\" },\n    why: \"llms.txt is an emerging standard that gives AI tools a short summary of your site. It's quick to add.\",\n    fix: 'Add a plain-text llms.txt file to the root of your site.',\n    test: 'Visit {d}/llms.txt. It should load a short summary with links to your key pages.',\n    code: '# Your Business\\n> Florist in Leeds offering wedding, funeral and same-day flowers.\\n\\n## Key pages\\n- [Services](https://{d}/services)\\n- [Prices](https://{d}/pricing)',\n    src: ['llms.txt proposal', 'https://llmstxt.org'] },\n  { id: 'nap', cat: 4, tech: 'NAP consistency', impact: 10,\n    h: { good: 'Your details match everywhere', warn: 'Your details differ across listings', bad: 'Your address and phone are inconsistent' },\n    mean: { good: 'Name, address and phone match on your site, Google and major directories.', warn: 'Your phone number on Yell differs from the one on your site.', bad: 'Three different addresses and two phone numbers appear across your listings.' },\n    why: 'Mismatched details make search engines and AI unsure which is right, so they show you less.',\n    fix: 'Pick one version of your name, address and phone, and update every listing to match.',\n    test: 'Search your business name and phone number. Every result should show identical details.',\n    code: null, src: GBP },\n  { id: 'reviews', cat: 4, tech: 'Google reviews', impact: 9,\n    h: { good: 'Strong, recent reviews', warn: 'Reviews are thin or dated', bad: 'Few or no reviews' },\n    mean: { good: '84 reviews averaging 4.8, with new ones every week.', warn: '23 reviews, but the most recent is 7 months old.', bad: 'Only 3 reviews on your Google Business Profile.' },\n    why: 'Reviews are a strong local ranking signal, and AI tools lean on them when deciding who to recommend.',\n    fix: 'Ask every happy customer for a review with a direct link, and reply to each one.',\n    test: 'Check your Google Business Profile. Aim for a new review every week and a reply on every one.',\n    code: null, src: GBP },\n  { id: 'localPages', cat: 4, tech: 'Local landing pages', impact: 6,\n    h: { good: 'Your service areas are clear', warn: 'Service areas are only mentioned in passing', bad: 'No mention of where you work' },\n    mean: { good: 'Each town you serve has its own page.', warn: 'You list towns in the footer, but have no pages for them.', bad: \"Your site doesn't say which areas you cover.\" },\n    why: \"People search with a place name. Without it on your site, you won't show up for those searches.\",\n    fix: 'Create a page for each main area you serve, with real details about work there.',\n    test: 'Search \"[your service] in [town]\" for each area. A page from your site should appear.',\n    code: null, src: STARTER },\n  { id: 'product', cat: 5, tech: 'Product schema', impact: 9,\n    h: { good: 'Products show price and stock', warn: 'Product details are incomplete', bad: 'Products have no structured data' },\n    mean: { good: 'Every product page has Product schema with price, availability and reviews.', warn: 'Product schema is missing price and availability.', bad: 'None of your product pages have Product schema.' },\n    why: 'Product schema lets Google and AI shopping tools show your price and stock directly.',\n    fix: 'Add Product schema to each product page.',\n    test: 'Run a product page through the Rich Results Test. A Product item should appear with price and availability.',\n    code: LT + 'script type=\"application/ld+json\">\\n{\\n  \"@context\": \"https://schema.org\",\\n  \"@type\": \"Product\",\\n  \"name\": \"Seasonal bouquet\",\\n  \"offers\": { \"@type\": \"Offer\", \"price\": \"45.00\", \"priceCurrency\": \"GBP\", \"availability\": \"https://schema.org/InStock\" }\\n}\\n' + LT + '/script>',\n    src: ['Google: Product structured data', 'https://developers.google.com/search/docs/appearance/structured-data/product'] },\n  { id: 'productContent', cat: 5, tech: 'Product descriptions', impact: 6,\n    h: { good: 'Products are well described', warn: 'Some product copy is thin', bad: 'Product pages are nearly empty' },\n    mean: { good: 'Product pages average 180 words with sizes, materials and delivery info.', warn: 'Half your products have one-line descriptions.', bad: 'Most products have a photo and a price, nothing else.' },\n    why: \"Thin product pages rarely rank, and AI tools can't recommend what they can't describe.\",\n    fix: \"Write 100+ words per product: what it is, who it's for, sizes and delivery.\",\n    test: 'Pick five products at random. Each should answer the questions a customer asks before buying.',\n    code: null, src: HELP },\n  { id: 'hreflang', cat: 6, tech: 'hreflang tags', impact: 8,\n    h: { good: 'Language versions are linked', warn: 'Some language versions are unlinked', bad: 'Language versions compete with each other' },\n    mean: { good: 'Every language version has correct hreflang tags.', warn: \"Your French pages have hreflang tags, but your German pages don't.\", bad: 'You have pages in several languages but no hreflang tags.' },\n    why: 'Without hreflang, search engines may show visitors the wrong language.',\n    fix: 'Add hreflang tags linking each language version to the others.',\n    test: 'Run your homepage through an hreflang checker. Each language should reference every other, including itself.',\n    code: LT + 'link rel=\"alternate\" hreflang=\"en-gb\" href=\"https://{d}/\">\\n' + LT + 'link rel=\"alternate\" hreflang=\"fr\" href=\"https://{d}/fr/\">',\n    src: ['Google: localized versions of your pages', 'https://developers.google.com/search/docs/specialty/international/localized-versions'] }\n];\nconst PATHS = ['/', '/about', '/services', '/contact', '/blog', '/gallery', '/pricing', '/faq', '/reviews', '/book'];\nconst STEPS = ['Crawling your pages', 'Technical SEO', 'Content quality (E-E-A-T)', 'Schema markup', 'AI search readiness (GEO)', 'Local SEO', 'E-commerce', 'International', 'Asking ChatGPT, Claude, Perplexity and Gemini'];\nconst AIS = ['ChatGPT', 'Claude', 'Perplexity', 'Gemini'];\nfunction brandOf(d) { if (d === 'bloomfloristry.co.uk') return 'Bloom Floristry'; const b = d.split('.')[0].replace(/-/g, ' '); return b.replace(/\\b\\w/g, c => c.toUpperCase()); }\nfunction promptsFor(d) {\n  const B = brandOf(d);\n  if (d === 'bloomfloristry.co.uk') return [['Best florist in Leeds', 0], ['Where can I get wedding flowers in Leeds?', 0], ['Same-day flower delivery in Leeds', 0], ['Who does funeral flowers near Headingley?', 0], ['What is Bloom Floristry like?', 1]];\n  return [['What does ' + B + ' do?', 1], ['Is ' + B + ' any good?', 1], ['Who are the best alternatives to ' + B + '?', 0], ['Businesses like ' + B + ' near me', 0], ['Should I use ' + B + '?', 1]];\n}\nconst EXAMPLE = 'bloomfloristry.co.uk';\n\nfunction seeded(str) {\n  let h = 1779033703 ^ str.length;\n  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }\n  return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };\n}\nfunction priOf(c) { return c.st === 'bad' ? (c.impact >= 12 ? 'Critical' : 'High') : c.st === 'warn' ? (c.impact >= 10 ? 'Medium' : 'Low') : 'Passing'; }\nfunction analyse(domain) {\n  const r = seeded(domain), ex = domain === EXAMPLE;\n  const ecom = ex ? true : r() < 0.4, intl = ex ? false : r() < 0.2;\n  let res = CHECKS.filter(c => (c.cat !== 5 || ecom) && (c.cat !== 6 || intl)).map(c => { const x = r(); return { ...c, st: x < 0.3 ? 'bad' : x < 0.6 ? 'warn' : 'good' }; });\n  if (ex) { const fixed = { robots: 'bad', sitemap: 'good', meta: 'good', https: 'good', cwv: 'warn', canonical: 'good', mobile: 'good', thin: 'warn', eeat: 'warn', titles: 'bad', headings: 'good', schema: 'bad', schemaValid: 'warn', js: 'warn', answers: 'bad', llms: 'bad', nap: 'warn', reviews: 'good', localPages: 'warn', product: 'bad', productContent: 'good' }; res = res.map(c => ({ ...c, st: fixed[c.id] || c.st })); }\n  let nonGood = res.filter(c => c.st !== 'good').length;\n  for (let i = 0; nonGood < 3 && i < res.length; i++) if (res[i].st === 'good') { res[i].st = 'warn'; nonGood++; }\n  res = res.map(c => ({ ...c, pri: priOf(c) }));\n  const tot = res.reduce((a, c) => a + c.impact, 0);\n  const score = Math.round(res.reduce((a, c) => a + ST[c.st].s * c.impact, 0) / tot);\n  const cats = CATS.map((k, i) => {\n    const cs = res.filter(c => c.cat === i);\n    if (!cs.length) return { ...k, na: true, score: 0 };\n    const s = Math.round(cs.reduce((a, c) => a + ST[c.st].s * c.impact, 0) / cs.reduce((a, c) => a + c.impact, 0));\n    return { ...k, score: s, color: s >= 75 ? ST.good.c : s >= 45 ? ST.warn.c : ST.bad.c };\n  });\n  const wins = res.filter(c => c.st !== 'good').map(c => ({ ...c, pts: Math.max(1, Math.round((100 - ST[c.st].s) * c.impact / tot)) })).sort((a, b) => b.pts - a.pts).slice(0, 3);\n  const pr = seeded(domain + '#p');\n  const prompts = promptsFor(domain).map(([q, branded]) => ({ q, cells: AIS.map(() => { const hit = pr() < (branded ? 0.35 : 0.1) + score / 160; return hit ? 1 + Math.floor(pr() * 5) : 0; }) }));\n  return { res, score, cats, wins, winIds: wins.map(w => w.id), prompts, areas: cats.filter(c => !c.na).length };\n}\n\nclass Component extends DCLogic {\n  areaRef = React.createRef(); scanCardRef = React.createRef(); catRef = React.createRef(); promptRef = React.createRef(); winRef = React.createRef(); resRef = React.createRef();\n  carGo(ref, d) { const el = ref.current; if (!el) return; const c = el.children[0]; el.scrollBy({ left: d * ((c ? c.offsetWidth : 280) + 12), behavior: 'smooth' }); }\n  goTab(i) { this.setState({ rtab: i }); const sc = document.querySelector('[data-scroller]'), el = this.resRef.current; if (sc && el) { const y = sc.scrollTop + el.getBoundingClientRect().bottom - sc.getBoundingClientRect().top - 70; sc.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); } }\n  areaGo(d) { const el = this.areaRef.current; if (!el) return; const c = el.children[0]; el.scrollBy({ left: d * ((c ? c.offsetWidth : 280) + 14), behavior: 'smooth' }); }\n  state = { phase: 'idle', url: '', domain: '', error: '', progress: 0, result: null, scoreShown: 0, open: null, copied: null, linkCopied: false, email: '', emailSent: false };\n\n  componentDidMount() {\n    const p = this.props.startPhase ?? 'idle';\n    const q = this.clean(new URLSearchParams(location.search).get('site') || '');\n    if (/^[a-z0-9-]+(\\.[a-z0-9-]+)+$/.test(q)) { this.setState({ url: q }); this.start(q); return; }\n    if (p === 'results') this.finish(EXAMPLE, true);\n    else if (p === 'scanning') this.start(EXAMPLE);\n  }\n  componentDidUpdate(prev) {\n    if (prev.startPhase !== this.props.startPhase) {\n      const p = this.props.startPhase ?? 'idle';\n      this.stop();\n      if (p === 'results') this.finish(EXAMPLE, true);\n      else if (p === 'scanning') this.start(EXAMPLE);\n      else this.setState({ phase: 'idle', result: null });\n    }\n  }\n  componentWillUnmount() { this.stop(); }\n  stop() {
